name: Scrape CCTV

on:
  schedule:
    - cron: "17 */6 * * *"  # tiap 6 jam (00:17, 06:17, ... UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        run: python3 scrape.py
      - name: Commit bila berubah
        run: |
          git config user.name "cctv-bot"
          git config user.email "cctv-bot@hozinking.my.id"
          git add cctv.json
          git diff --cached --quiet || git commit -m "update cctv.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
